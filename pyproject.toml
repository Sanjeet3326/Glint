[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glintscan"
version = "0.2.1"
description = "Offline security scanner for AI agent configs, prompts and MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjeet Kumar" }]
keywords = ["security", "ai-agents", "mcp", "prompt-injection", "static-analysis", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "coverage>=7.5", "build>=1.2"]

[project.scripts]
glint = "glint.cli:main"

[project.urls]
Homepage = "https://github.com/Sanjeet3326/glint"
Issues = "https://github.com/Sanjeet3326/glint/issues"
Changelog = "https://github.com/Sanjeet3326/glint/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["glint*"]

[tool.setuptools.package-data]
glint = ["cards/*.md", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
"glint/reporters/html.py" = ["E501"]  # inline CSS and markup
"scripts/render_svg.py" = ["E501"]  # inline SVG markup

[tool.mypy]
strict = true
python_version = "3.11"

[tool.coverage.run]
source = ["glint"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
