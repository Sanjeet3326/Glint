name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Clean demo must have zero findings
        run: glint scan demo/clean-agent --fail-on low

      - name: Vulnerable demo must trigger every rule
        shell: python
        run: |
          import json, subprocess
          out = subprocess.run(
              ["glint", "scan", "demo/vulnerable-agent", "--format", "json"],
              capture_output=True, text=True,
          )
          assert out.returncode == 1, out.returncode
          found = {f["rule_id"] for f in json.loads(out.stdout)["findings"]}
          expected = {f"GL-{i:03d}" for i in range(1, 11)}
          missing = expected - found
          assert not missing, f"rules that did not fire: {sorted(missing)}"
          print(f"all {len(expected)} rules fired")
