name: False positive
description: Glint flagged something harmless.
labels: ["false positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: GL-001
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The text or config that was flagged
      description: Redact secrets and private details. Paste as plain text.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it harmless?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glint version
      placeholder: output of `glint version`
